<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms one</title>
    <style>
        body{
            background-color: #0e0d0dd9;
            color: #fff;
        }
    </style>
        
     
</head>
<body>
    <h1>Forms in html </h1>
    <form action="url" method="post" accept-charset="UTF-8" autocomplete="on""></form>
    <label for="fname">first name </label> <br>
    <input type="text" placeholder="frist name " name="" id="fname"> <br> <br>
    <label for="lname">last name </label><br>
    <input type="text" placeholder="last name" name="" id="lname"> <br> <br>

    <input type="hidden" name="">
    <button type="submit">submit</button>
    <label for="eemail">enter your email</label>
    <input type="email" name="email" id="eemail" placeholder="@gmail.com">
    <input type="week" name="" id="">
    <select name="editors" id="" >
        <option value="vs code">vscode</option>
        <option value="sublimetext">sublimetext</option>
    </select>

    <input list="editors" name="editor">
    <datalist id="editors">
        <option value="vs code">vscode</option>
        <option value="sublimetext">sublimetext</option>
    </datalist>
    <input type="range" name="volume" id="" min="0" max="100">
    <input type="radio" name="" id="">
    
    
</body>
</html>
