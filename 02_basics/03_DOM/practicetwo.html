<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add edit Remove </title>
</head>
<body>
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>

  <script>

    //add 
   
    function addlan(lang){
         const li = document.createElement('li')
         const addText =document.createTextNode(lang)
         li.appendChild(addText)
         document.querySelector('.language').appendChild(li)

    }
    addlan('python')
    addlan("Java")
    addlan("C++")

    //edit 2nd element python to mkb

    const second = document.querySelector('li:nth-child(2)')
    console.log(second);
  
    const newText = document.createTextNode("mkb")
    const newli = document.createElement('li')
    newli.appendChild(newText)
    second.replaceWith(newli)

    //edit 3rd element java to c program
    
   const third= document.querySelector('li:nth-child(3)')
    const newText2 = document.createTextNode('C-program')
    const newli2 = document.createElement('li')
    newli2.appendChild(newText2)
    third.replaceWith(newli2)

    //remove c++ mean 4th 

    const fourth = document.querySelector('li:nth-child(4)')
    fourth.remove()


    
  </script>
</html>
